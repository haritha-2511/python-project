<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <a href="{{ url_for('timetable.index') }}">Back</a>
  <h4 class="mt-2">{{ title }}</h4>

  <table class="table table-bordered text-center">
    <tr class="table-dark">
      <th>Period</th>
      {% for day in days %}
        <th>{{ day }}</th>
      {% endfor %}
    </tr>

    {% for p in periods %}
      <tr>
        <td>P{{ p }}<br><small>{{ timings[p] }}</small></td>
        {% for day in days %}
          {% if p in grid[day] %}
            <td style="white-space: pre-line;">{{ grid[day][p] }}</td>
          {% else %}
            <td class="table-light text-muted">College over</td>
          {% endif %}
        {% endfor %}
      </tr>

      {% if p in breaks %}
        <tr class="table-secondary">
          <td colspan="6">{{ breaks[p] }}</td>
        </tr>
      {% endif %}
    {% endfor %}
  </table>
</body>
</html>
