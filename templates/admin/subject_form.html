{% extends "admin/layout.html" %}
{% block admin_content %}
<h4>{{ mode }} subject</h4>
<form method="post" class="mt-3">
  <div class="row g-3 mb-3">
    <div class="col-md-3">
      <label class="form-label">Subject code</label>
      <input class="form-control" name="code" value="{{ form.code }}" required>
    </div>
    <div class="col-md-5">
      <label class="form-label">Subject name</label>
      <input class="form-control" name="name" value="{{ form.name }}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Department</label>
      <select class="form-select" name="department" required>
        <option value="">Choose...</option>
        {% for d in departments %}<option value="{{ d }}" {{ 'selected' if form.department == d }}>{{ d }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Theory periods per week</label>
      <input class="form-control" type="number" min="0" max="10" name="theory_periods" value="{{ form.theory_periods }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Lab periods per week</label>
      <input class="form-control" type="number" min="0" max="10" name="lab_periods" value="{{ form.lab_periods }}" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Lab periods held in (if any)</label>
      <select class="form-select" name="lab_type">
        {% for key, label in lab_types.items() %}<option value="{{ key }}" {{ 'selected' if form.lab_type == key }}>{{ label }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <p class="text-muted small">Subject type is worked out automatically: theory only, lab only, or theory + lab.</p>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('admin.subjects_list') }}">Cancel</a>
</form>
{% endblock %}
